<!DOCTYPE html>
<html>

<head>
    <title>List</title>
</head>

<body>
    <!-- un-order list-1 -->
    <ul>
        <li>Fruits</li>
        <li>Drinks</li>
    </ul>

    <!-- UnOrder List-2 -->
    <ul type="circle">
        <li>Fruits
            <ul type="disc">
                <li>Mango</li>
                <li>Banana</li>
            </ul>
        </li>
        <li>Drinks
            <ul type="square">
                <li>Coke</li>
                <li>Pepsi</li>
            </ul>
        </li>

    </ul>

    <!-- Order List-1-------- -->
    <ol>
        <li>Fruits</li>
        <li>Drinks</li>
    </ol>
    <!-- Order List 2----- -->
    <ol type="I">
        <li>Fruits
            <ol type="a">
                <li>Mango</li>
                <li>Banana</li>
            </ol>
        </li>
        <li>Drinks
            <ol type="i">
                <li>Coke</li>
                <li>Pepsi</li>
            </ol>
        </li>
    </ol>


    <!-- order and un order -->


    <!-- adding img -->

    <a href="https://www.farhadbinmomin.me/">
        <img src="./img1.jpg" width="100" height="100">
    </a>
</body>

</html>
